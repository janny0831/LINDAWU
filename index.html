<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保管品管理系統 - 日期格式自動修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sticky-col { position: sticky; right: 0; background-color: white; z-index: 10; box-shadow: -4px 0 6px -2px rgba(0, 0, 0, 0.05); }
        .sticky-header { position: sticky; top: 0; background-color: #f1f5f9; z-index: 20; }
        .sticky-col-header { position: sticky; right: 0; top: 0; background-color: #f1f5f9; z-index: 30; }
        tr:hover .sticky-col { background-color: #f0f7ff; }
        
        .highlight-row {
            animation: highlight-pulse 2.5s ease-out;
        }
        @keyframes highlight-pulse {
            0% { background-color: #fef08a; }
            80% { background-color: #fef08a; } 
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen relative">

    <div class="max-w-[98vw] mx-auto p-4">
        
        <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    大量(管理部)保管品管理系統
                </h1>
                <p class="text-sm text-slate-500 mt-1">已實作智慧型日期偵測，自動將 Excel 序號轉換為 YYYY/MM/DD 格式。</p>
                <!-- 調整位置與樣式：將資料總計移至此處，並改為不透明且高質感的狀態標籤 -->
                <div class="mt-2.5">
                    <span id="systemStats" class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold rounded-full shadow-sm">
                        總計 - 清單: 0 筆 | 日誌: 0 筆
                    </span>
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-3">
                <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileUpload(event)">
                <label for="fileUpload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition flex items-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    匯入 Excel
                </label>

                <!-- 雲端載入按鈕 -->
                <button id="loadGasBtn" onclick="loadFromGAS()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-6 rounded-lg transition flex items-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    從雲端載入
                </button>
                
                <!-- 同步雲端按鈕 -->
                <button id="syncGasBtn" onclick="syncToGAS()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg transition flex items-center gap-2 shadow-sm hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    同步至雲端
                </button>

                <button onclick="openAddModal()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition flex items-center gap-2 shadow-sm">
                    新增項目
                </button>
                <button id="exportBtn" onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-6 rounded-lg transition flex items-center gap-2 shadow-sm hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    匯出備份
                </button>
            </div>
        </header>

        <div id="mainContent" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-200 mb-4 gap-4">
                <div class="flex">
                    <button onclick="switchTab('page1')" id="tab-page1" class="py-3 px-6 text-sm font-bold border-b-2 border-blue-600 text-blue-600 transition-colors">資料清單</button>
                    <button onclick="switchTab('page2')" id="tab-page2" class="py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-colors">異動日誌</button>
                </div>
                
                <div id="searchContainer" class="w-full md:w-80 pb-2 md:pb-0">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </span>
                        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜尋品名、單號、保管人、異動紀錄..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm">
                    </div>
                </div>
            </div>

            <div id="page1" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto max-h-[75vh]">
                    <table class="w-full text-xs text-left whitespace-nowrap">
                        <thead id="tableHead" class="sticky-header"></thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="page2" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto max-h-[75vh]">
                    <table class="w-full text-xs text-left whitespace-nowrap">
                        <thead id="logTableHead" class="sticky-header text-slate-600"></thead>
                        <tbody id="logBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="emptyState" class="flex flex-col items-center justify-center p-24 bg-white rounded-xl shadow-sm border border-slate-200 text-center">
            <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">尚未匯入資料</h3>
            <p class="text-slate-500 max-w-sm mx-auto">請上傳 Excel 檔案。系統會自動修復常見的日期序號錯誤（如 45292 變回 2024/01/01）。</p>
        </div>
    </div>

    <!-- 資料編輯 Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold text-slate-800">資料編輯</h3>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition text-slate-400"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div class="p-8 overflow-y-auto flex-1">
                <form id="editForm" onsubmit="handleFormSubmit(event)">
                    <div id="editFormFields" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-6"></div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="closeModal()" class="px-6 py-2.5 border border-slate-300 rounded-xl text-slate-700 bg-white hover:bg-slate-50 transition font-bold">取消</button>
                <button type="submit" form="editForm" class="px-10 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-bold shadow-md">儲存並更新</button>
            </div>
        </div>
    </div>

    <!-- 資料刪除確認 Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">確認刪除項目？</h3>
            <p id="confirmText" class="text-slate-500 mb-8">此操作將無法復原。</p>
            <div class="flex gap-4">
                <button onclick="closeConfirm()" class="flex-1 px-4 py-3 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition font-bold">取消</button>
                <button id="confirmBtn" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 transition font-bold shadow-lg">確認移除</button>
            </div>
        </div>
    </div>

    <!-- 日誌編輯 Modal -->
    <div id="editLogModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800">異動日誌編輯</h3>
                <button onclick="closeLogModal()" class="p-2 hover:bg-slate-100 rounded-full transition text-slate-400"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div class="p-8 overflow-y-auto flex-1">
                <form id="editLogForm" onsubmit="handleLogFormSubmit(event)">
                    <div id="editLogFormFields" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-6"></div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="closeLogModal()" class="px-6 py-2.5 border border-slate-300 rounded-xl text-slate-700 bg-white hover:bg-slate-50 transition font-bold">取消</button>
                <button type="submit" form="editLogForm" class="px-10 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-bold shadow-md">儲存並更新</button>
            </div>
        </div>
    </div>

    <!-- 日誌刪除確認 Modal -->
    <div id="confirmLogModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">確認刪除此日誌？</h3>
            <p class="text-slate-500 mb-8">此操作將移除該筆異動紀錄，無法復原。</p>
            <div class="flex gap-4">
                <button onclick="closeLogConfirm()" class="flex-1 px-4 py-3 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition font-bold">取消</button>
                <button onclick="executeLogDelete()" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 transition font-bold shadow-lg">確認移除</button>
            </div>
        </div>
    </div>

    <script>
        // --- Google Apps Script (GAS) 網址設定區塊 ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxmqlF0noTFIqy0NfWF1GW_09OwmTZCl3XpDq02z_Qso7pYUOBX7eo4KInN9snc3IFN/exec"; 

        const STANDARD_HEADERS = [
            "是否盤點", "日期", "保管單號碼", "保管品號碼", "品名", "廠牌", "規格", "型式", 
            "取得成本", "保管人", "部門", "存放地點", "備註", 
            "固資轉列管取得日期", "處理結果", "轉出部門", "轉入部門", "取得日期"
        ];
        const DATE_FIELDS = ["日期", "固資轉列管取得日期", "取得日期"];

        const appState = {
            data: [],
            logs: [],
            editUid: null,
            isNew: false,
            editLogUid: null,
            filters: {},
            logFilters: {}
        };

        window.currentSearchTerm = '';

        const escapeHTML = (str) => {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        };

        const generateLogUid = () => 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

        function parseExcelDate(val) {
            if (val === undefined || val === null || val === "") return "";
            if (!isNaN(val) && typeof val !== 'boolean' && parseFloat(val) > 10000) {
                const date = new Date(Math.round((parseFloat(val) - 25569) * 86400 * 1000));
                if (!isNaN(date.getTime())) {
                    const y = date.getUTCFullYear();
                    const m = String(date.getUTCMonth() + 1).padStart(2, '0');
                    const d = String(date.getUTCDate()).padStart(2, '0');
                    return `${y}/${m}/${d}`;
                }
            }
            const strVal = String(val).trim();
            if (/\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(strVal)) {
                return strVal.replace(/-/g, '/');
            }
            const d = new Date(val);
            if (!isNaN(d.getTime())) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}/${m}/${day}`;
            }
            return strVal;
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const binary = new Uint8Array(e.target.result);
                const workbook = XLSX.read(binary, { type: 'array' });
                const sheetName = workbook.SheetNames.find(n => n.includes("保管品") || n.includes("清單")) || workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                const importedData = rawRows.map((rawRow, idx) => {
                    const row = {};
                    const rawKeys = Object.keys(rawRow);
                    const keyMap = {};
                    rawKeys.forEach(k => keyMap[String(k).replace(/\s+/g, '')] = k);

                    STANDARD_HEADERS.forEach(stdH => {
                        const cleanStdH = stdH.replace(/\s+/g, '');
                        let val = "";
                        if (rawRow[stdH] !== undefined) {
                            val = rawRow[stdH];
                        } else if (keyMap[cleanStdH]) {
                            val = rawRow[keyMap[cleanStdH]];
                        } else if (cleanStdH === "取得成本" && keyMap["取代成本"]) {
                            val = rawRow[keyMap["取代成本"]];
                        }
                        if (DATE_FIELDS.includes(stdH)) val = parseExcelDate(val);
                        row[stdH] = String(val).trim();
                    });
                    row._uid = 'uid_' + Date.now() + '_' + idx;
                    return row;
                });

                const logSheetName = workbook.SheetNames.find(n => n.includes("日誌"));
                let importedLogs = [];
                if (logSheetName) {
                    const logRows = XLSX.utils.sheet_to_json(workbook.Sheets[logSheetName], { defval: "" });
                    importedLogs = logRows.map(l => {
                        const logObj = { time: l["異動時間"] || "", action: l["動作"] || "", target: l["單號對象"] || "", details: l["詳細內容"] || "", uid: null, _logUid: generateLogUid(), rowData: {} };
                        STANDARD_HEADERS.forEach(h => {
                            let cellVal = l[h] || "";
                            if (DATE_FIELDS.includes(h)) cellVal = parseExcelDate(cellVal);
                            logObj.rowData[h] = cellVal;
                        });
                        const match = importedData.find(d => d["保管單號碼"] === logObj.target && logObj.target !== "");
                        if (match) logObj.uid = match._uid;
                        return logObj;
                    });
                }

                appState.data = importedData;
                appState.logs = importedLogs.reverse();
                initSystemView();
            };
            reader.readAsArrayBuffer(file);
            e.target.value = '';
        }

        function initSystemView() {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('exportBtn').classList.remove('hidden');
            document.getElementById('syncGasBtn').classList.remove('hidden');
            renderTable();
            renderLogs();
        }

        // 統一更新上方標頭區塊的總計數據（保持完全不透明、精緻邊框與背景配色）
        function updateStats() {
            let displayData = appState.data;
            Object.keys(appState.filters || {}).forEach(col => {
                displayData = displayData.filter(row => String(row[col] || "") === appState.filters[col]);
            });
            if (window.currentSearchTerm) {
                const term = window.currentSearchTerm.toLowerCase();
                displayData = displayData.filter(row => STANDARD_HEADERS.some(h => String(row[h] || '').toLowerCase().includes(term)));
            }
            let dataFilteredCount = displayData.length;

            let displayLogs = appState.logs;
            Object.keys(appState.logFilters || {}).forEach(col => {
                displayLogs = displayLogs.filter(log => {
                    if (['time', 'action', 'target', 'details'].includes(col)) return String(log[col] || "") === appState.logFilters[col];
                    return String(log.rowData?.[col] || "") === appState.logFilters[col];
                });
            });
            if (window.currentSearchTerm) {
                const term = window.currentSearchTerm.toLowerCase();
                displayLogs = displayLogs.filter(log => {
                    return String(log.time || '').toLowerCase().includes(term) ||
                           String(log.action || '').toLowerCase().includes(term) ||
                           String(log.target || '').toLowerCase().includes(term) ||
                           String(log.details || '').toLowerCase().includes(term) ||
                           STANDARD_HEADERS.some(h => String(log.rowData?.[h] || '').toLowerCase().includes(term));
                });
            }
            let logsFilteredCount = displayLogs.length;

            const statsEl = document.getElementById('systemStats');
            if (statsEl) {
                const hasFilters = Object.keys(appState.filters || {}).length > 0 || Object.keys(appState.logFilters || {}).length > 0;
                statsEl.innerText = (window.currentSearchTerm || hasFilters) 
                    ? `篩選/搜尋結果 - 清單: ${dataFilteredCount} | 日誌: ${logsFilteredCount}` 
                    : `總計 - 清單: ${dataFilteredCount} 筆 | 日誌: ${logsFilteredCount} 筆`;
            }
        }

        function handleFilter(column, value) {
            if (!appState.filters) appState.filters = {};
            if (value === "") delete appState.filters[column];
            else appState.filters[column] = value;
            renderTable();
        }

        function handleLogFilter(column, value) {
            if (!appState.logFilters) appState.logFilters = {};
            if (value === "") delete appState.logFilters[column];
            else appState.logFilters[column] = value;
            renderLogs();
        }

        function handleSearch(val) {
            window.currentSearchTerm = val.trim();
            renderTable();
            renderLogs();
        }

        function locateItem(uid) {
            switchTab('page1');

                appState.logs.unshift({ time: timestamp, action: '新增', target: newValues['保管單號碼'] || '手動建立', details: '手動新增資料', uid: newValues._uid, _logUid: generateLogUid(), rowData: {...newValues} });
            } else {
                const idx = appState.data.findIndex(d => d._uid === appState.editUid), oldData = appState.data[idx], changes = [];
                STANDARD_HEADERS.forEach(h => { if (oldData[h] !== newValues[h]) changes.push(`[${h}]：${oldData[h]||'空'}➔${newValues[h]||'空'}`); });

                    appState.logs.unshift({ time: timestamp, action: '修正', target: oldData['保管單號碼'] || '無單號', details: changes.join('；'), uid: appState.editUid, _logUid: generateLogUid(), rowData: {...newValues} });

        // ====================================================
        // Google Apps Script (GAS) 雲端連線功能 (改善了巢狀展開邏輯)
        // ====================================================

        async function loadFromGAS() {
            if (!GAS_URL) {
                alert('請先在程式碼中設定 GAS_URL！');
                return;
            }
            const btn = document.getElementById('loadGasBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '連線載入中...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    appState.data = result.data || [];
                    
                    // 從雲端載入時，將被攤平(Flatten)的欄位重新組裝成 rowData 以維持系統現有架構
                    appState.logs = (result.logs || []).map(flatLog => {
                        let log = {
                            time: flatLog["異動時間"] || flatLog.time || "",
                            action: flatLog["動作"] || flatLog.action || "",
                            target: flatLog["單號對象"] || flatLog.target || "",
                            details: flatLog["詳細內容"] || flatLog.details || "",
                            uid: flatLog.uid || "",
                            _logUid: flatLog._logUid || generateLogUid(),
                            rowData: {}
                        };
                        
                        // 為了相容您原本已經寫進去的舊資料 (如果有舊的 JSON 字串)
                        if (flatLog.rowData && typeof flatLog.rowData === 'string') {
                            try { log.rowData = JSON.parse(flatLog.rowData); } catch(e) {}
                        } else {
                            // 將新版的純文字欄位一一對應抓進來
                            STANDARD_HEADERS.forEach(h => {
                                log.rowData[h] = flatLog[h] !== undefined ? flatLog[h] : "";
                            });
                        }
                        return log;
                    });
                    
                    if (appState.data.length > 0 || appState.logs.length > 0) {
                        initSystemView();
                        alert('✅ 雲端資料載入成功！');
                    } else {
                        alert('雲端資料庫目前為空，請匯入 Excel 或新增項目後同步至雲端。');
                    }
                } else {
                    alert('載入失敗：' + (result.message || '未知錯誤'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ 載入失敗！請確認：\n1. GAS 網址是否正確。\n2. GAS 部署權限是否設為「所有人」。\n3. 網路連線是否正常。');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function syncToGAS() {
            if (!GAS_URL) {
                alert('請先在程式碼中設定 GAS_URL！');
                return;
            }
            if (appState.data.length === 0 && appState.logs.length === 0) {
                alert('目前沒有資料可以同步！');
                return;
            }

            const btn = document.getElementById('syncGasBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '同步至雲端中...';
            btn.disabled = true;

            try {
                // 為了讓 Google Sheet 顯示正常表頭，把巢狀的 rowData 攤平 (Flatten) 傳送
                const flattenedLogs = appState.logs.map(l => {
                    let o = { "異動時間": l.time, "動作": l.action, "單號對象": l.target, "詳細內容": l.details, "uid": l.uid, "_logUid": l._logUid };
                    if (l.rowData) STANDARD_HEADERS.forEach(h => o[h] = l.rowData[h] || "");
                    return o;
                });

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'sync',
                        data: appState.data,
                        logs: flattenedLogs
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('✅ 成功同步至 Google Sheet！(您可以在雲端看到正常的表格了)');
                } else {
                    alert('同步失敗：' + (result.message || '未知錯誤'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ 同步失敗！請確認 GAS 部署權限是否設為「所有人」。');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // 初始化時執行一次統計資料更新，確保開局顯示正確預設值
        updateStats();

    </script>
</body>
</html>
